spring.datasource.url=jdbc:mysql://localhost:3306/tabacchimanagement
spring.datasource.username=root
spring.datasource.password=root

# Configurazione JPA
spring.jpa.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration - IMPORTANTE: Cambiare in produzione
jwt.secret=${JWT_SECRET:myVeryLongAndSecureSecretKeyThatIsAtLeast256BitsLongForHS512Algorithm1234567890}
jwt.expiration=3600000
jwt.refresh.expiration=604800000

# Email Configuration
spring.mail.enabled=true
spring.mail.host=smtp.libero.it
spring.mail.port=587
spring.mail.username=pelmarco99@libero.it
spring.mail.password=Strategieroulette1!
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Server Configuration
server.port=8080

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# Logging per sicurezza
logging.level.it.tabacchi.security=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Jasypt Encryption Configuration
# IMPORTANTE: In produzione, questa password DEVE essere passata come variabile d'ambiente o da un vault, non hardcoded.
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD:MySuperSecretKeyForEncryptionThatIsVeryLongAndSecure123}
jasypt.encryptor.algorithm=PBEWITHHMACSHA512ANDAES_256
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.RandomIvGenerator
jasypt.encryptor.salt-generator-classname=org.jasypt.salt.RandomSaltGenerator
jasypt.encryptor.string-output-type=base64

# Disabilita open-in-view: evita che la connessione resti aperta per tutta la richiesta HTTP
spring.jpa.open-in-view=false

# Configurazione HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1700000

# Leak detection: logga una warning con lo stack trace se la connessione non viene rilasciata entro 15s
spring.datasource.hikari.leak-detection-threshold=15000